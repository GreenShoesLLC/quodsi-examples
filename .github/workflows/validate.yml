name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/__tests__/catalog.test.mjs
      - run: node scripts/build-manifest.mjs --check
      - run: node scripts/validate.mjs
